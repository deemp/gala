# IntelliJ Platform SDK — using GoLand for LSP API support
# Latest 2025.2.x patch: com.intellij.modules.lsp, which plugin.xml depends on, is only
# declared from 2025.2.1; against 2025.2 itself the plugin is not loaded in tests.
ideaVersion=2025.2.6.2
# ANTLR version (must match the transpiler's ANTLR version)
antlr4Version=4.13.2
# Adaptor library version (0.1 is the only Maven Central release)
antlr4AdaptorVersion=0.1
# Plugin version
pluginVersion=3.0.0
# The IntelliJ Platform bundles its own Kotlin standard library; don't package a second copy.
kotlin.stdlib.default.dependency=false
